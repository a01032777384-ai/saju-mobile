<!doctype html><html lang="ko"><meta charset="utf-8"><title>배포 검증</title><style>body{font:16px system-ui;background:#eee;color:#222}iframe{height:840px;border:1px solid #777}pre{white-space:pre-wrap}button{padding:15px}</style><h1>별담 배포 검증</h1><button id="w360">360px</button><button id="w390">390px</button><button id="w430">430px</button><button id="auth">실제 인증 점검</button><pre id="out"></pre><iframe id="frame" title="모바일 화면" width="360" src="./index.html"></iframe><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script><script type="module">
const frame=document.getElementById('frame'),out=document.getElementById('out');const log=t=>out.textContent+=t+'\n';
for(const w of [360,390,430])document.getElementById('w'+w).onclick=()=>{frame.width=w;requestAnimationFrame(()=>{const d=frame.contentDocument;log(w+'px: document='+d.documentElement.clientWidth+', scroll='+d.documentElement.scrollWidth+', horizontal overflow='+(d.documentElement.scrollWidth>d.documentElement.clientWidth));});};
document.getElementById('auth').onclick=async()=>{document.getElementById('auth').disabled=true;const client=supabase.createClient('https://tngyafnlufaaexiqvgdi.supabase.co','sb_publishable_s1ylhSJ01XbMuitoSrSCqQ_mQZjrTBg',{auth:{persistSession:false,autoRefreshToken:false}});try{const settings=await fetch('https://tngyafnlufaaexiqvgdi.supabase.co/auth/v1/settings',{headers:{apikey:'sb_publishable_s1ylhSJ01XbMuitoSrSCqQ_mQZjrTBg'}}).then(r=>r.json());log('Auth settings: '+JSON.stringify({email_enabled:settings.external?.email,mailer_autoconfirm:settings.mailer_autoconfirm,disable_signup:settings.disable_signup}));const email='saju-qa-'+crypto.randomUUID()+'@example.com',password=crypto.randomUUID()+'Aa!9';const signed=await client.auth.signUp({email,password});log('회원가입: '+(signed.error?signed.error.code+': '+signed.error.message:signed.data.session?'즉시 세션 생성':'세션 없음 / 이메일 확인 필요'));if(signed.data.session){await client.auth.signOut();const login=await client.auth.signInWithPassword({email,password});log('로그인: '+(login.error?login.error.message:'PASS'));const bad=await client.auth.signInWithPassword({email,password:password+'wrong'});log('잘못된 비밀번호: '+(bad.error?.code==='invalid_credentials'?'PASS':bad.error?.code||'FAIL'));const logout=await client.auth.signOut();log('로그아웃: '+(logout.error?logout.error.message:'PASS'));}else{const bad=await client.auth.signInWithPassword({email,password:password+'wrong'});log('잘못된 비밀번호: '+(bad.error?.code==='invalid_credentials'?'PASS':bad.error?.code||'FAIL'));}}catch(e){log('ERROR '+e.message);}};
</script></html>
